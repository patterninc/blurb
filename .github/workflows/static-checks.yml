# Credential-free PR checks (items 10, 11, 13, 23): the same hooks and tests as `make all`.
# Added by closing-ai-readiness-gaps. Make "Static Checks" a required status check (item 16).
name: 'Static Checks'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 'Static Checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Ruby version from .ruby-version; installs Gemfile.lock into vendor/bundle.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Pre-commit hooks (format, lint, validate)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Unit tests
        run: make test

      - name: License scan of installed gems (item 18)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: vendor/bundle
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Upload test results (item 33)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*-junit.xml'
          if-no-files-found: ignore
